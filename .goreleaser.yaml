version: 2

project_name: bread

before:
  hooks:
    - go mod tidy

builds:
  - id: bread
    main: ./cmd/bread
    binary: bread
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/HuakunShen/bread/internal/version.Value={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: archives
    ids:
      - bread
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - README.zh-CN.md

checksum:
  name_template: checksums.txt

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Generate a tap formula into dist. The release workflow uploads it as an
# asset; the optional Homebrew workflow then copies that exact formula to the
# external tap with a separately scoped token.
brews:
  - name: bread
    ids:
      - archives
    directory: Formula
    homepage: https://github.com/HuakunShen/bread
    description: Bounded batch file reader for coding agents
    license: MIT
    repository:
      owner: HuakunShen
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: true
