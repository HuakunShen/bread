name: Homebrew tap

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to the tap
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish formula to tap
    if: vars.HOMEBREW_TAP_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAP_REPOSITORY: HuakunShen/homebrew-tap
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Publish generated formula
        run: ./scripts/publish-homebrew-formula.sh
